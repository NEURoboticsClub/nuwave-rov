name: GUI command send
on:
  pull_request:
    paths:
      - src/web_gui_pkg/static/build_dashboard.js
      - src/web_gui_pkg/test/test_publish_message.cjs
      - .github/workflows/gui-command-send.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/web_gui_pkg/test/test_publish_message.cjs
