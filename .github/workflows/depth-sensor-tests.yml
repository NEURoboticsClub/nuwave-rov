name: Depth sensor tests

on:
  pull_request:
    paths:
      - src/depth_sensor_pkg/**
      - .github/workflows/depth-sensor-tests.yml
  push:
    branches: [main]
    paths:
      - src/depth_sensor_pkg/**
      - .github/workflows/depth-sensor-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depth-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test depth sensor node without ROS or hardware
        run: python -m pytest -q src/depth_sensor_pkg/test/test_depth_sensor_node.py
