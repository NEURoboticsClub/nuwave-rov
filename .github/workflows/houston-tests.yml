name: houston tests

on:
  pull_request:
    paths:
      - src/houston_pkg/**
      - .github/workflows/houston-tests.yml
  push:
    branches: [main]
    paths:
      - src/houston_pkg/**
      - .github/workflows/houston-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  houston:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest numpy PyYAML
      - name: Test production node with controlled external interfaces
        run: python -m pytest -q src/houston_pkg/test/test_houston_node.py
