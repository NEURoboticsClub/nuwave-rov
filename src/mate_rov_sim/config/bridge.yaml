# Arm joint positions, Gazebo -> ROS (for debugging / plotting)
- ros_topic_name: "/sim/joint_states"
  gz_topic_name: "/world/mate_pool/model/rov/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# IMU, Gazebo -> ROS (gravity included; imu_sim turns it into /imu)
- ros_topic_name: "/sim/imu_raw"
  gz_topic_name: "/rov/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Cameras, Gazebo -> ROS (raw; camera_sim turns them into /camera_N/image/compressed)
- ros_topic_name: "/sim/camera_0/image"
  gz_topic_name: "/rov/camera_0/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/sim/camera_1/image"
  gz_topic_name: "/rov/camera_1/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Ground-truth pose and velocity, Gazebo -> ROS (world frame, z up; the surface is z = 0)
- ros_topic_name: "/sim/odom_ground_truth"
  gz_topic_name: "/model/rov/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Water current for disturbance tests, ROS -> Gazebo (m/s, world frame)
#   ros2 topic pub --once /ocean_current geometry_msgs/msg/Vector3 "{x: 0.2, y: 0.0, z: 0.0}"
- ros_topic_name: "/ocean_current"
  gz_topic_name: "/ocean_current"
  ros_type_name: "geometry_msgs/msg/Vector3"
  gz_type_name: "gz.msgs.Vector3d"
  direction: ROS_TO_GZ
