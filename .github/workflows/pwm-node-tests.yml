name: PWM node tests

on:
  pull_request:
    paths:
      - src/thruster_pkg/**
      - .github/workflows/pwm-node-tests.yml
  push:
    branches: [main]
    paths:
      - src/thruster_pkg/**
      - .github/workflows/pwm-node-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwm-node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest numpy PyYAML
      - name: Test PWM node without ROS or hardware
        run: python -m pytest -q src/thruster_pkg/test/test_pwm_node.py
