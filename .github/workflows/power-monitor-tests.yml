name: power-monitor tests

on:
  pull_request:
    paths:
      - src/power_monitor_pkg/**
      - .github/workflows/power-monitor-tests.yml
  push:
    branches: [main]
    paths:
      - src/power_monitor_pkg/**
      - .github/workflows/power-monitor-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  power-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test production node with controlled external interfaces
        run: python -m pytest -q src/power_monitor_pkg/test/test_power_monitor_node.py
