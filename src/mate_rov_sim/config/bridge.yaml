  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/arm_elbow_pitch_joint/cmd"
  gz_topic_name: "/model/rov/joint/arm_elbow_pitch_joint/cmd_vel"
