name: pwm-write-errors
on:
  pull_request:
    paths:
      - src/thruster_pkg/thruster_pkg/pwm_scribe_hat.py
      - src/thruster_pkg/thruster_pkg/pca9685_driver.py
      - src/thruster_pkg/test/test_pwm_scribe_hat.py
      - .github/workflows/pwm-write-errors.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q src/thruster_pkg/test/test_pwm_scribe_hat.py
