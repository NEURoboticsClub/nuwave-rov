# ros_gz_bridge configuration: which topics cross between Gazebo and ROS 2.
# Each entry: ROS name/type <-> Gazebo name/type, plus a direction.
# Check Gazebo-side names with:  gz topic -l      ROS-side with:  ros2 topic list
#
# Everything on the ROS side lives under /sim/... : these are the simulator's
# internal wires. The NUWave nodes never see them; they talk to the sim nodes
# (sim_motor_interface, imu_sim, depth_sensor_sim, camera_sim) on the real topics.

# Simulation clock -> ROS (every node run with use_sim_time:=true follows this)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Thruster commands, ROS -> Gazebo. Newtons. Gazebo holds the last value it received.
# Published by sim_motor_interface, one per /thruster/<name> in individual_motor_config.yaml.
- ros_topic_name: "/sim/thruster_fll_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_fll_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_frl_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_frl_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_rll_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_rll_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_rrl_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_rrl_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_flv_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_flv_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_frv_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_frv_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_rlv_joint/cmd"
  gz_topic_name: "/model/rov/joint/thruster_rlv_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/thruster_rrv_joint/cmd"
