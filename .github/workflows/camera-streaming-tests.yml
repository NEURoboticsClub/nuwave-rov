name: camera-streaming tests

on:
  pull_request:
    paths:
      - src/camera_pkg/**
      - .github/workflows/camera-streaming-tests.yml
  push:
    branches: [main]
    paths:
      - src/camera_pkg/**
      - .github/workflows/camera-streaming-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest numpy opencv-python-headless
      - name: Test production node with controlled external interfaces
        run: python -m pytest -q src/camera_pkg/test/test_camera_node.py
