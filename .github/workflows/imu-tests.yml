name: imu tests

on:
  pull_request:
    paths:
      - src/imu_pkg/**
      - .github/workflows/imu-tests.yml
  push:
    branches: [main]
    paths:
      - src/imu_pkg/**
      - .github/workflows/imu-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Test production node with controlled external interfaces
        run: python -m pytest -q src/imu_pkg/test/test_imu_node.py
